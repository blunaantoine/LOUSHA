# ============================================================
# Configuration Nginx — Lousha Accessories
# Domaine : loushatg.duckdns.org
# Reverse proxy vers le serveur Next.js (port 3004)
# ============================================================
#
# Installation :
#   sudo cp deploy/nginx-lousha.conf /etc/nginx/sites-available/lousha
#   sudo ln -sf /etc/nginx/sites-available/lousha /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (HTTPS) :
#   sudo certbot --nginx -d loushatg.duckdns.org
#   (certbot modifiera ce fichier pour ajouter le bloc 443 automatiquement)
# ============================================================

# --- Bloc HTTP (redirige vers HTTPS après certbot) ---
server {
    listen 80;
    listen [::]:80;
    server_name loushatg.duckdns.org;

    # Redirection HTTP → HTTPS (décommenter après certbot)
    # return 301 https://$host$request_uri;

    # Sert les images uploadées directement (plus rapide que Next.js)
    location /uploads/ {
        alias /var/www/lousha/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Reverse proxy vers Next.js
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }
}

