# ============================================================
# Configuration Nginx — Lousha Accessories
# Domaine : loushatg.duckdns.org
# Reverse proxy vers le serveur Next.js (port 3004)
# ============================================================
#
# Installation :
#   sudo cp deploy/nginx-lousha.conf /etc/nginx/sites-available/lousha
#   sudo ln -s /etc/nginx/sites-available/lousha /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# SSL (HTTPS) :
#   sudo certbot --nginx -d loushatg.duckdns.org
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name loushatg.duckdns.org;

    # Redirection HTTP → HTTPS (décommenter après certbot)
    # return 301 https://$host$request_uri;

    # --- Reverse proxy (à commenter après activation HTTPS) ---
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Upload images (max 10 Mo)
        client_max_body_size 10M;
    }
}

