# ============================================================
# Configuration Nginx — Lousha Accessories
# Domaines :
#   - lousha-accessoire.com (principal)
#   - www.lousha-accessoire.com (redirige vers principal)
#   - loushatg.duckdns.org (ancien, redirige vers principal)
# Reverse proxy vers Next.js (port 3004)
# ============================================================
#
# Installation :
#   sudo cp deploy/nginx-lousha.conf /etc/nginx/sites-available/lousha
#   sudo ln -sf /etc/nginx/sites-available/lousha /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (HTTPS) :
#   sudo certbot --nginx -d lousha-accessoire.com -d www.lousha-accessoire.com -d loushatg.duckdns.org
#   (certbot ajoutera automatiquement les certificats SSL)
# ============================================================

# --- Bloc HTTP principal : lousha-accessoire.com ---
# Certbot transformera ce bloc en redirection HTTPS après génération du certificat
server {
    listen 80;
    listen [::]:80;
    server_name lousha-accessoire.com www.lousha-accessoire.com loushatg.duckdns.org;

    # Redirection HTTP → HTTPS (décommenter après certbot)
    # return 301 https://$host$request_uri;

    # Sert les images uploadées directement (plus rapide que Next.js)
    location /uploads/ {
        alias /var/www/lousha/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sert les fichiers statiques (favicon, images, etc.)
    location /favicon.ico {
        alias /var/www/lousha/public/favicon.ico;
        access_log off;
    }
    location /images/ {
        alias /var/www/lousha/public/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Reverse proxy vers Next.js
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }
}

# --- Redirections HTTPS (générées par certbot) ---
# Après avoir lancé :
#   sudo certbot --nginx -d lousha-accessoire.com -d www.lousha-accessoire.com -d loushatg.duckdns.org
#
# Certbot créera automatiquement :
#   - Un bloc server listen 443 ssl pour lousha-accessoire.com
#   - Des redirections 301 de HTTP vers HTTPS
#
# Pour rediriger www et l'ancien domaine vers le domaine principal, ajoutez
# dans le bloc 443 de www et loushatg.duckdns.org :
#
#   return 301 https://lousha-accessoire.com$request_uri;
#
# Et ajoutez dans le bloc 443 principal (lousha-accessoire.com) :
#
#   location /uploads/ {
#       alias /var/www/lousha/public/uploads/;
#       expires 30d;
#       add_header Cache-Control "public, immutable";
#       access_log off;
#   }
